stages: [build-prepare, build-shared, build-static]

variables:
  CORENAME: gam8
  # The pinned templates collect Make outputs from their disposable checkout root.
  DISTDIR: "."
  MAKEFILE_PATH: .
  JNI_PATH: .

include:
  - project: libretro-infrastructure/ci-templates
    ref: 2221b6f4c39340a70a9d2b677719167e0f6e62e8
    file:
      - /android-jni.yml
      - /ctr-legacy-static.yml
      - /ctr-static.yml
      - /dingux-arm32.yml
      - /dingux-mips32.yml
      - /djgpp-static.yml
      - /emscripten-static.yml
      - /ios-arm64.yml
      - /ios9.yml
      - /libnx-static.yml
      - /libounce-static.yml
      - /linux-aarch64.yml
      - /linux-i686.yml
      - /linux-x64.yml
      - /ngc-static.yml
      - /orbis-static.yml
      - /osx-arm64.yml
      - /osx-ppc.yml
      - /osx-x64.yml
      - /ps2-static.yml
      - /psl1ght-static.yml
      - /psp-static.yml
      - /tvos-arm64.yml
      - /vita-static.yml
      - /webos-make.yml
      - /wii-static.yml
      - /wiiu-static.yml
      - /windows-i686-mingw.yml
      - /windows-i686-msvc05-msys2.yml
      - /windows-i686-msvc10-msys2.yml
      - /windows-i686-msvc19-msys2.yml
      - /windows-x64-mingw.yml
      - /windows-x64-msvc10-msys2.yml
      - /windows-x64-msvc19-msys2.yml

device-and-presentation-tests:
  stage: build-prepare
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake gcc libc6-dev make
  script:
    - cmake -S . -B build/tests -DGAM8_TESTS=ON -DCMAKE_BUILD_TYPE=Release
    - cmake --build build/tests --parallel
    - ctest --test-dir build/tests --output-on-failure --no-tests=error

# The pinned templates put their distributable binaries at the repository root.
.gam8-package:
  artifacts:
    paths:
      - ${CORENAME}_libretro*
      - info/gam8_libretro.info
      - LICENSE
      - NOTICE
      - third_party/MAME-BSD.txt
    exclude:
      - "*.a"
      - "*.bc"
      - "*.exp"
      - "*.lib"
      - "*.pdb"

# Static jobs use a DAG to fetch the matching frontend from RetroArch.
# Include our test job in that DAG as well as the upstream artifact dependency.
.gam8-static-package:
  extends: .gam8-package
  needs:
    - job: device-and-presentation-tests
      artifacts: false
    - project: libretro/RetroArch
      job: ${STATIC_RETROARCH_JOB_NAME}
      ref: ${STATIC_RETROARCH_BRANCH}
      artifacts: true

